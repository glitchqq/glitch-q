name: Deploy reset.html to Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - 'reset.html'
      - 'firebase.json'
      - '.github/workflows/firebase-hosting.yml'

# The job only needs to read the repository; nothing here may write to it.
permissions:
  contents: read
  checks: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, not a moving tag: this job holds the Firebase service-account secret, so a re-pointed tag
      # must not be able to run new code with it. To update, review the new release, then change the hash and the comment.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          persist-credentials: false

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a   # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          projectId: glitch-q
          channelId: live

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script>
// Redirect Firebase auth action URLs (password reset, e-mail verification) to reset.html, everything else to index.html
const p = new URLSearchParams(window.location.search);
const mode = p.get('mode');
const oobCode = p.get('oobCode');
const l = p.get('lang');
const langQ = (l === 'en' || l === 'ar') ? '&lang=' + l : '';   // no language given → reset.html uses the visitor's saved choice
if ((mode === 'resetPassword' || mode === 'verifyEmail') && oobCode) {
  window.location.replace(
    'https://glitchqq.github.io/glitch-q/reset.html?mode=' + mode + '&oobCode=' + encodeURIComponent(oobCode) + langQ
  );
} else {
  window.location.replace('https://glitchqq.github.io/glitch-q/');
}
</script>
</head>
<body></body>
</html>
